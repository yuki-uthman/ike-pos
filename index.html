<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ike Today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f4f7f6;
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1614; } }

  .app {
    --bg: #f4f7f6; --surface: #ffffff; --muted: #edf2f0; --ink: #0d1f1c; --ink2: #4c5f5b; --ink3: #7c8c88;
    --border: rgba(13,31,28,0.08); --rule: #e8edeb;
    --accent: #3b4fa8;
    --warn: #b8541e; --warn-soft: rgba(184,84,30,0.10);
    --shadow: 0 1px 2px rgba(13,31,28,0.05), 0 12px 32px -16px rgba(13,31,28,0.22);
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --bg: #0b1614; --surface: #11201d; --muted: #162622; --ink: #f2f6f5; --ink2: #b7c6c2; --ink3: #82938e;
      --border: rgba(255,255,255,0.08); --rule: #1e2d2a;
      --accent: #7b8ce0;
      --warn: #d9772f; --warn-soft: rgba(217,119,47,0.14);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -16px rgba(0,0,0,0.6);
    }
  }

  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 12px; width: 100%; max-width: 1160px; margin: 0 auto; }

  .daterow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
  .dayname { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .daydate { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

  .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(0, 1fr); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }

  .cardhead { padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kind { display: inline-flex; align-items: center; gap: 8px; font-family: Manrope, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
  .count { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .total { display: flex; align-items: baseline; gap: 7px; margin-top: 4px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .cur { font-size: 13px; font-weight: 700; color: var(--ink3); letter-spacing: 0.03em; }

  .rows { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 10px; }
  .item + .item > .row { box-shadow: inset 0 1px 0 var(--rule); }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 11px; width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; }
  .row.has { cursor: pointer; }
  .row.has:hover, .row.has[aria-expanded="true"] { background: var(--muted); box-shadow: none; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { flex: 0 0 auto; color: var(--ink3); transition: transform 0.2s ease; }
  .row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }

  .detail { margin: 2px 10px 8px; padding: 9px 12px 10px; background: var(--muted); border-radius: 11px; display: flex; flex-direction: column; gap: 5px; }
  .lhead { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .lrow { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
  .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .lqty { flex: 0 0 46px; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .ltot { flex: 0 0 72px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ref { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cust { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cust.anon { font-weight: 400; color: var(--ink3); font-style: italic; }
  .amt { flex: 0 0 auto; font-family: Manrope, sans-serif; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .empty { margin: auto; padding: 24px; text-align: center; color: var(--ink3); font-size: 14px; }

  .otherstrip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: var(--warn-soft); border: 1px solid var(--border); font-size: 13.5px; color: var(--ink2); }
  .otherstrip b { color: var(--warn); font-weight: 700; }
  .otherstrip .amt { margin-left: auto; color: var(--warn); }

  .state-msg { margin: auto; max-width: 420px; text-align: center; color: var(--ink2); font-size: 14.5px; padding: 24px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .item { animation: none !important; } .chev { transition: none; } }

  @media (min-width: 900px) {
    .shell { padding: 30px 40px 20px; gap: 20px; }
    .content { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 22px; }
    .dayname { font-size: 26px; }
    .daydate { font-size: 14px; }
    .cardhead { padding: 22px 24px 16px; }
    .total { font-size: 44px; }
    .cur { font-size: 15px; }
    .row { padding: 11px 14px; }
    .ref { font-size: 12px; }
    .otherstrip { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="shell" id="shell">
    <div class="daterow">
      <div>
        <div class="dayname" id="dayname">&nbsp;</div>
        <div class="daydate" id="daydate">&nbsp;</div>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/today.json';
  var REFRESH_MS = 60000; // ike-data itself refreshes every 15 min; this just keeps the page honest

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var contentEl = document.getElementById('content');
  var daynameEl = document.getElementById('dayname');
  var daydateEl = document.getElementById('daydate');
  var stampEl = document.getElementById('stamp');

  // Odoo carries the internal reference inside the product name: "[PP9] PAPER PLATE 9"".
  function stripCode(name) {
    return String(name).replace(/^\[[^\]]*\]\s*/, '').trim();
  }

  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }

  var rowSeq = 0;

  function rowHtml(t, i) {
    var anon = !t.customer || t.customer === 'Walk-in';
    var delay = Math.min(i, 12) * 30 + 'ms';
    var lines = t.lines || [];
    var has = lines.length > 0;
    var id = 'lines-' + (++rowSeq);
    var tag = has ? 'button' : 'div';

    var head = '<' + tag + ' class="row' + (has ? ' has' : '') + '"' +
      (has ? ' type="button" aria-expanded="false" aria-controls="' + id + '"' : '') + '>' +
      '<span class="ref">' + escapeHtml(t.ref || '—') + '</span>' +
      '<span class="cust' + (anon ? ' anon' : '') + '">' + escapeHtml(t.customer || 'Walk-in') + '</span>' +
      '<span class="amt">' + fmt(t.amount) + '</span>' +
      (has
        ? '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>'
        : '') +
      '</' + tag + '>';

    var detail = has
      ? '<div class="detail" id="' + id + '" hidden>' +
          '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' +
          lines.map(lineHtml).join('') +
        '</div>'
      : '';

    return '<div class="item" style="animation: rise 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      head + detail + '</div>';
  }

  function cardHtml(title, swatch, bucket, rows, currency) {
    var n = rows.length;
    var body = n
      ? rows.map(rowHtml).join('')
      : '<div class="empty">No ' + title.toLowerCase() + ' payments yet today.</div>';
    return '<div class="card">' +
      '<div class="cardhead">' +
        '<div class="headrow">' +
          '<span class="kind"><span class="swatch" style="background:' + swatch + '"></span>' + title + '</span>' +
          '<span class="count">' + n + (n === 1 ? ' transaction' : ' transactions') + '</span>' +
        '</div>' +
        '<div class="total"><span class="cur">' + escapeHtml(currency) + '</span><span>' + fmt(bucket.total || 0) + '</span></div>' +
      '</div>' +
      '<div class="rows">' + body + '</div>' +
      '</div>';
  }

  function render(payload) {
    rowSeq = 0;
    var currency = payload.currency || 'MVR';
    var all = payload.transactions || [];
    var byAmount = function (a, b) { return b.amount - a.amount; };
    var transfer = all.filter(function (t) { return t.method === 'transfer'; }).sort(byAmount);
    var cash = all.filter(function (t) { return t.method === 'cash'; }).sort(byAmount);
    var other = all.filter(function (t) { return t.method !== 'transfer' && t.method !== 'cash'; });

    var d = new Date((payload.date || '') + 'T00:00:00Z');
    if (!isNaN(d.getTime())) {
      daynameEl.textContent = DAYN[d.getUTCDay()];
      daydateEl.textContent = d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
    }
    if (payload.generatedAt) {
      var g = new Date(payload.generatedAt);
      if (!isNaN(g.getTime())) {
        stampEl.innerHTML = '<span class="dot"></span>updated ' +
          g.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Indian/Maldives' });
      }
    }

    var html =
      cardHtml('Transfer', 'var(--accent)', payload.transfer || {}, transfer, currency) +
      cardHtml('Cash', 'var(--ink3)', payload.cash || {}, cash, currency);

    if (other.length) {
      var names = {};
      other.forEach(function (t) { names[t.rawMethod || 'unknown'] = true; });
      var nameList = Object.keys(names).map(function (n) { return '“' + escapeHtml(n) + '”'; }).join(', ');
      var otherTotal = other.reduce(function (s, t) { return s + t.amount; }, 0);
      html += '<div class="otherstrip">' +
        '<span><b>' + other.length + (other.length === 1 ? ' payment' : ' payments') + '</b> came in as ' + nameList +
        ' — neither cash nor transfer, so not counted in either total.</span>' +
        '<span class="amt">' + fmt(otherTotal) + '</span>' +
        '</div>';
    }

    var open = openRowKeys();
    contentEl.innerHTML = html;
    restoreOpen(open);
  }

  // A refresh every 60s must not slam shut a row the user is reading, so
  // remember which rows were open by their reference + amount, not by index.
  function openRowKeys() {
    var keys = {};
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row[aria-expanded="true"]'), function (row) {
      keys[rowKey(row)] = true;
    });
    return keys;
  }
  function rowKey(row) {
    return row.querySelector('.ref').textContent + '|' + row.querySelector('.amt').textContent;
  }
  function restoreOpen(keys) {
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row.has'), function (row) {
      if (keys[rowKey(row)]) setExpanded(row, true);
    });
  }
  function setExpanded(row, open) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var detail = document.getElementById(row.getAttribute('aria-controls'));
    if (detail) detail.hidden = !open;
  }

  contentEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row.has');
    if (!row) return;
    setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
  });

  function showMessage(msg) {
    contentEl.innerHTML = '<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  function load(isRefresh) {
    return fetch(DATA_URL, { cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) throw new Error('not-yet');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(render)
      .catch(function (err) {
        if (isRefresh) return;
        if (err.message === 'not-yet') {
          showMessage('No payment data yet \u2014 run the \u201cRefresh sales + expenses + today data\u201d workflow in ike-data once to seed it.');
        } else {
          showMessage('Could not load today\u2019s payments (' + err.message + '). Try refreshing in a minute.');
        }
      });
  }

  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load(true);
  });
})();
</script>
</body>
</html>
