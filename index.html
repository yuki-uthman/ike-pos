<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ike POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: #f4f7f6;
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1614; } }

  .app {
    --bg: #f4f7f6; --surface: #ffffff; --muted: #edf2f0; --ink: #0d1f1c; --ink2: #4c5f5b; --ink3: #7c8c88;
    --border: rgba(13,31,28,0.08); --rule: #e8edeb;
    --accent: #3b4fa8;
    --warn: #b8541e; --warn-soft: rgba(184,84,30,0.10);
    --out: #b8541e;
    /* pos/neg lean on the palette's own hues rather than stock red/green:
       pos is a saturated lift of --ink's own dark teal-green (the same
       "banked" teal family ike-sales uses for money received), neg is a
       muted brick red - warm like --out/--warn, but cool enough not to be
       mistaken for it sitting in the same card. */
    --pos: #1c7d5c; --neg: #b3413a;
    --shadow: 0 1px 2px rgba(13,31,28,0.05), 0 12px 32px -16px rgba(13,31,28,0.22);
    /* min-height, not height: the page is a floor of one viewport, not a
       ceiling. A day with more cash-in/cash-out rows than fit in 100vh
       should grow the page and let the browser scroll it, rather than
       clipping each card to a fixed slice and scrolling inside it. */
    min-height: 100vh; min-height: 100dvh;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --bg: #0b1614; --surface: #11201d; --muted: #162622; --ink: #f2f6f5; --ink2: #b7c6c2; --ink3: #82938e;
      --border: rgba(255,255,255,0.08); --rule: #1e2d2a;
      --accent: #7b8ce0;
      --warn: #d9772f; --warn-soft: rgba(217,119,47,0.14);
      --out: #d9772f;
      --pos: #34c795; --neg: #d97268;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -16px rgba(0,0,0,0.6);
    }
  }

  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 12px; width: 100%; max-width: 1160px; margin: 0 auto; }

  /* ---- date pills (same pattern as ike-sales, no chart) ---- */
  .pillswrap { position: relative; min-width: 0; }
  .pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
  .fade { position: absolute; top: 0; bottom: 0; left: 0; width: 96px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(244,247,246,0) 100%); pointer-events: none; transition: opacity 0.25s; opacity: 0; }
  @media (prefers-color-scheme: dark) { .fade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(11,22,20,0) 100%); } }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }

  .daterow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
  .dayname { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .daydate { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .stamp { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }

  /* Content is a column: the Till card, then the Transfer/Cash pair, then
     the "other" strip (if any) - each at its own natural height. Nothing
     here is clipped to the viewport: .app's min-height is a floor, not a
     ceiling, so a day with more rows than fit in one screen grows the page
     and lets the browser scroll it, rather than scrolling inside a card. */
  .content { display: flex; flex-direction: column; gap: 14px; }
  .cardsrow { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; }

  /* The till's own reconciliation now lives inside the Cash card, not a
     separate card: Opening Balance bookends the top (same visual weight as
     Total In/Out below it - it's a total-tier figure too, just not derived
     from today's rows), In/Out sit in the middle as shipped, and Expected
     Closing/Counted/Difference bookend the bottom as a second ledger. */
  .ledger { padding: 14px 18px 4px; }
  .ledger.opening-only { border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
  .lrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .lrow .llabel { font-size: 13px; color: var(--ink2); }
  .lrow .lval { font-family: Manrope, sans-serif; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .lrow .lval .cur { font-size: 11px; font-weight: 700; color: var(--ink3); letter-spacing: 0.03em; }
  .lrow .lval.pos { color: var(--pos); }
  .lrow .lval.neg { color: var(--neg); }
  .lrow .lval.muted { color: var(--ink3); }
  /* Opening Balance reads at the same size/weight as Total In and Total Out
     - it's the same tier of figure, just the day's starting point rather
     than something today's rows add up to - and gets its own accent color
     so it doesn't get lost now that it's as loud as its neighbors. */
  .lrow.opening .llabel { font-family: Manrope, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); }
  .lrow.opening .lval { font-size: 20px; letter-spacing: -0.01em; color: var(--accent); }
  .lrow.subtotal { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 13px; }
  .lrow.subtotal .llabel { font-family: Manrope, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); }
  .lrow.subtotal .lval { font-size: 21px; letter-spacing: -0.01em; }
  .lrow.grandtotal { border-top: 1px solid var(--rule); margin-top: 4px; padding-top: 15px; padding-bottom: 17px; }
  .lrow.grandtotal .llabel { font-family: Manrope, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink3); }
  .lrow.grandtotal .lval { font-size: 27px; letter-spacing: -0.015em; }

  .cardhead { padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kind { display: inline-flex; align-items: center; gap: 8px; font-family: Manrope, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }
  .swatch { width: 9px; height: 9px; border-radius: 3px; flex: 0 0 auto; }
  .count { font-size: 12.5px; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .total { display: flex; align-items: baseline; gap: 7px; margin-top: 4px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .total.pos { color: var(--pos); }
  .total.neg { color: var(--neg); }
  .cur { font-size: 13px; font-weight: 700; color: var(--ink3); letter-spacing: 0.03em; }

  .rows { padding: 6px 8px 10px; }
  .sectionhead { padding: 10px 10px 6px; font-family: Manrope, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3); }
  .rows > .sectionhead:not(:first-child) { margin-top: 6px; border-top: 1px solid var(--rule); padding-top: 16px; }

  /* The section's own total sits at the BOTTOM of its row list, like a
     receipt - and reads louder than any individual row above it (bigger,
     bolder, the section's own color), since the total is the number that
     matters more than any one line under it. */
  .sectiontotal { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 10px 8px; margin-top: 2px; border-top: 1px solid var(--rule); }
  .sectiontotal .stitle { font-family: Manrope, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink3); }
  .sectiontotal .stot { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .sectiontotal.pos .stot { color: var(--pos); }
  .sectiontotal.out .stot { color: var(--out); }
  .item + .item > .row { box-shadow: inset 0 1px 0 var(--rule); }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 11px; width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; }
  .row.has { cursor: pointer; }
  .row.has:hover, .row.has[aria-expanded="true"] { background: var(--muted); box-shadow: none; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chev { flex: 0 0 auto; color: var(--ink3); transition: transform 460ms cubic-bezier(0.34, 2, 0.64, 1), color 200ms ease; transition: transform 460ms linear(0, 0.0859, 0.2929, 0.5499, 0.7997, 1.0042, 1.1443, 1.2175, 1.2328, 1.2056, 1.1536, 1.093, 1.0362, 0.9912, 0.9616, 0.9475, 0.9462, 0.9541, 0.9669, 0.9811, 0.9939, 1.0037, 1.0099, 1.0125, 1.0123, 1.0102, 1), color 200ms ease; }
  .row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }

  /* Animating to a content height nothing has measured: the wrapper is a grid
     whose single row goes 0fr -> 1fr, which interpolates, unlike height:auto. */
  .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(0.45, 0, 0.7, 0.25); }
  .detailwrap.open {
    grid-template-rows: 1fr;
    transition: grid-template-rows 480ms cubic-bezier(0.34, 1.7, 0.64, 1);
    transition: grid-template-rows 480ms linear(0, 0.0626, 0.2135, 0.4047, 0.6002, 0.7756, 0.9172, 1.0201, 1.0854, 1.1184, 1.1262, 1.1166, 1.0966, 1.0722, 1.0477, 1.026, 1.0086, 0.9962, 0.9885, 0.9848, 0.9841, 0.9855, 0.9881, 0.9913, 0.9943, 0.997, 1);
  }
  .detailclip { overflow: hidden; min-height: 0; }

  .detail { margin: 2px 10px 8px; padding: 9px 12px 10px; background: var(--muted); border-radius: 11px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(-16px) scale(0.965); transition: opacity 150ms ease, transform 260ms cubic-bezier(0.5, -0.2, 0.75, 0.4); }
  .detailwrap.open .detail {
    opacity: 1; transform: none;
    transition: opacity 200ms ease 30ms, transform 560ms cubic-bezier(0.34, 2, 0.64, 1);
    transition: opacity 200ms ease 30ms, transform 560ms linear(0, 0.0859, 0.2929, 0.5499, 0.7997, 1.0042, 1.1443, 1.2175, 1.2328, 1.2056, 1.1536, 1.093, 1.0362, 0.9912, 0.9616, 0.9475, 0.9462, 0.9541, 0.9669, 0.9811, 0.9939, 1.0037, 1.0099, 1.0125, 1.0123, 1.0102, 1);
  }

  /* Listed last so it outranks the .open rules above at equal specificity. */
  .detailwrap.instant, .detailwrap.instant .detail { transition: none; }
  .lhead { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .lrow { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
  .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .lqty { flex: 0 0 46px; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .ltot { flex: 0 0 72px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ref { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cust { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cust.anon { font-weight: 400; color: var(--ink3); font-style: italic; }
  .amt { flex: 0 0 auto; font-family: Manrope, sans-serif; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .amt.out { color: var(--out); }
  .amt.pos { color: var(--pos); }

  .empty { margin: auto; padding: 24px; text-align: center; color: var(--ink3); font-size: 14px; }

  .otherstrip { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 14px; background: var(--warn-soft); border: 1px solid var(--border); font-size: 13.5px; color: var(--ink2); }
  .otherstrip b { color: var(--warn); font-weight: 700; }
  .otherstrip .amt { margin-left: auto; color: var(--warn); }

  .state-msg { margin: auto; max-width: 420px; text-align: center; color: var(--ink2); font-size: 14.5px; padding: 24px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    /* !important rather than out-specificing .detailwrap.open and
       .detailwrap.open .detail separately - a motion opt-out should not be one
       selector away from being silently outranked again. */
    .item { animation: none !important; }
    .chev, .detailwrap, .detail { transition: none !important; }
    .detail { opacity: 1; transform: none; }
  }

  @media (min-width: 900px) {
    .shell { padding: 30px 40px 20px; gap: 18px; }
    .content { gap: 22px; }
    .cardsrow { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    .dayname { font-size: 26px; }
    .daydate { font-size: 14px; }
    .cardhead { padding: 22px 24px 16px; }
    .total { font-size: 44px; }
    .cur { font-size: 15px; }
    .row { padding: 11px 14px; }
    .ref { font-size: 12px; }
    .ledger { padding: 18px 24px 6px; }
    .ledger.opening-only { padding-bottom: 16px; }
    .lrow .lval { font-size: 16px; }
    .lrow.opening .lval { font-size: 20px; }
    .lrow.subtotal .lval { font-size: 24px; }
    .lrow.grandtotal .lval { font-size: 32px; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="shell" id="shell">
    <div class="pillswrap">
      <div class="pills" id="pills"></div>
      <div class="fade" id="fade"></div>
    </div>
    <div class="daterow">
      <div>
        <div class="dayname" id="dayname">&nbsp;</div>
        <div class="daydate" id="daydate">&nbsp;</div>
      </div>
      <div class="stamp" id="stamp"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/sales.json';
  var REFRESH_MS = 60000; // ike-data itself refreshes every 15 min; this just keeps the page honest

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stripCode(name) {
    return String(name).replace(/^\[[^\]]*\]\s*/, '').trim();
  }

  var pillsEl = document.getElementById('pills');
  var fadeEl = document.getElementById('fade');
  var contentEl = document.getElementById('content');
  var daynameEl = document.getElementById('dayname');
  var daydateEl = document.getElementById('daydate');
  var stampEl = document.getElementById('stamp');

  var days = [];               // k=0 today ... k=N-1 oldest
  var state = { idx: 0, booted: false };

  // ---- Build view-model days from the ike-data sales feed (same shape ike-sales reads) ----
  function buildViewDays(rawDays) {
    var asc = rawDays.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var arr = asc.slice().reverse(); // today first
    return arr.map(function (rd, k) {
      var d = new Date(rd.date + 'T00:00:00Z');
      var wd = DAYN[d.getUTCDay()], dn = d.getUTCDate(), mo = MON[d.getUTCMonth()], yr = d.getUTCFullYear();
      var received = (rd.pos ? rd.pos.total : 0) + (rd.regularSales ? rd.regularSales.total : 0);
      return {
        k: k, date: rd.date, wd: wd, generatedAt: rd.generatedAt,
        total: received,
        transactions: rd.transactions || [],
        cash: rd.cash || { total: 0, count: 0 },
        transfer: rd.transfer || { total: 0, count: 0 },
        other: rd.other || { total: 0, count: 0 },
        cashOut: rd.cashOut || { total: 0, count: 0 },
        cashOutTransactions: rd.cashOutTransactions || [],
        till: rd.till || null,
        label: k === 0 ? 'Today' : wd.slice(0, 3) + ' ' + dn,
        dateFull: dn + ' ' + mo + ' ' + yr
      };
    });
  }

  function go(i) {
    if (i < 0 || i >= days.length || i === state.idx) return;
    state.idx = i;
    renderDay();
  }

  // ---- Pills: listeners wired once; markup refreshed in place on every poll,
  // without resetting scroll position or re-registering handlers. ----
  var pillsWired = false;
  function renderPillsHtml() {
    var ordered = days.slice().reverse(); // oldest left, today right
    pillsEl.innerHTML = ordered.map(function (d) {
      return '<button class="pill" data-idx="' + d.k + '">' + escapeHtml(d.label) + '</button>';
    }).join('');
  }
  function buildPills() {
    renderPillsHtml();
    if (!pillsWired) {
      pillsWired = true;
      pillsEl.addEventListener('click', function (e) {
        var btn = e.target.closest('.pill');
        if (!btn) return;
        go(parseInt(btn.getAttribute('data-idx'), 10));
      });
      pillsEl.addEventListener('scroll', function () { syncFade(); });
    }
    requestAnimationFrame(function () {
      try { pillsEl.scrollLeft = pillsEl.scrollWidth; } catch (e) {}
      syncFade();
    });
  }
  function syncFade() {
    fadeEl.style.opacity = pillsEl.scrollLeft > 2 ? '1' : '0';
  }
  function updatePillStyles() {
    Array.prototype.forEach.call(pillsEl.querySelectorAll('.pill'), function (btn) {
      var k = parseInt(btn.getAttribute('data-idx'), 10);
      var d = days[k];
      if (!d) return;
      var active = k === state.idx;
      btn.style.background = active ? 'var(--accent)' : 'var(--surface)';
      btn.style.color = active ? '#ffffff' : (d.total === 0 ? 'var(--ink3)' : 'var(--ink2)');
      btn.style.boxShadow = active ? '0 6px 14px -6px rgba(0,0,0,0.35)' : '0 1px 2px rgba(13,31,28,0.06)';
    });
  }

  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }

  var rowSeq = 0;

  function rowHtml(t, i, tint) {
    var anon = !t.customer || t.customer === 'Walk-in';
    var delay = Math.min(i, 12) * 30 + 'ms';
    var lines = t.lines || [];
    var has = lines.length > 0;
    var id = 'lines-' + (++rowSeq);
    var tag = has ? 'button' : 'div';

    var head = '<' + tag + ' class="row' + (has ? ' has' : '') + '"' +
      (has ? ' type="button" aria-expanded="false" aria-controls="' + id + '"' : '') + '>' +
      '<span class="ref">' + escapeHtml(t.ref || '—') + '</span>' +
      '<span class="cust' + (anon ? ' anon' : '') + '">' + escapeHtml(t.customer || 'Walk-in') + '</span>' +
      '<span class="amt' + (tint ? ' ' + tint : '') + '">' + fmt(t.amount) + '</span>' +
      (has
        ? '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>'
        : '') +
      '</' + tag + '>';

    var detail = has
      ? '<div class="detailwrap" id="' + id + '" aria-hidden="true"><div class="detailclip">' +
          '<div class="detail">' +
            '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' +
            lines.map(lineHtml).join('') +
          '</div>' +
        '</div></div>'
      : '';

    return '<div class="item" style="animation: rise 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      head + detail + '</div>';
  }

  // Difference (and only Difference) still needs a signed "+X / -X" format;
  // Opening/Expected/Counted are plain magnitudes, never signed.
  function fmtSigned(n, currency) {
    if (n === 0) return escapeHtml(currency) + ' ' + fmt(0);
    var sign = n > 0 ? '+' : '−';
    return sign + escapeHtml(currency) + ' ' + fmt(Math.abs(n));
  }

  // Plain card (Transfer): one bucket, one row list.
  function cardHtml(title, swatch, bucket, rows, currency, unit) {
    var n = rows.length;
    var body = n
      ? rows.map(rowHtml).join('')
      : '<div class="empty">No ' + title.toLowerCase() + ' payments yet.</div>';
    return '<div class="card">' +
      '<div class="cardhead">' +
        '<div class="headrow">' +
          '<span class="kind"><span class="swatch" style="background:' + swatch + '"></span>' + title + '</span>' +
          '<span class="count">' + n + ' ' + (n === 1 ? unit : unit + 's') + '</span>' +
        '</div>' +
        '<div class="total"><span class="cur">' + escapeHtml(currency) + '</span><span>' + fmt(bucket.total || 0) + '</span></div>' +
      '</div>' +
      '<div class="rows">' + body + '</div>' +
      '</div>';
  }

  // Till cash-out row: reason + who, no product detail to expand.
  function outRowHtml(t, i) {
    var delay = Math.min(i, 12) * 30 + 'ms';
    return '<div class="item" style="animation: rise 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      '<div class="row">' +
        '<span class="ref">' + escapeHtml(t.time || '—') + '</span>' +
        '<span class="cust">' + escapeHtml(t.reason || '-') + '</span>' +
        '<span class="amt out">−' + fmt(t.amount) + '</span>' +
      '</div></div>';
  }

  // Cash card: a bookend ledger. Opening Balance leads, before In even
  // starts; In and Out sit in the middle exactly as before, each with its
  // own receipt-style total; Expected Closing/Counted/Difference close the
  // card right after Out ends. The whole card reads as one continuous
  // ledger from float to reconciliation, not a transaction list with a
  // separate till card bolted on beside it. The headline total stays net
  // (In minus Out), colored green when the day is up and red when it's
  // down - the one number meant to answer "how did cash move today" at a
  // glance; till is missing on a day with no session, so the opening/
  // closing ledger pieces just don't render rather than showing empty dashes.
  function cashCardHtml(inBucket, inRows, outBucket, outRows, till, currency) {
    var inBody = inRows.length
      ? inRows.map(function (t, i) { return rowHtml(t, i, 'pos'); }).join('')
      : '<div class="empty">No cash payments yet.</div>';
    var outBody = outRows.length
      ? outRows.map(outRowHtml).join('')
      : '<div class="empty">No cash taken out yet.</div>';
    var net = (inBucket.total || 0) - (outBucket.total || 0);
    var netClass = net < 0 ? 'neg' : 'pos';
    var netText = net < 0 ? '−' + fmt(Math.abs(net)) : fmt(net);
    var money = function (n) { return '<span class="cur">' + escapeHtml(currency) + '</span> ' + fmt(n); };

    var openingHtml = '';
    var closingHtml = '';
    if (till) {
      var diffKnown = till.difference !== null && till.difference !== undefined;
      var balanced = diffKnown && till.difference === 0;
      var diffClass = diffKnown ? (balanced ? '' : (till.difference > 0 ? 'pos' : 'neg')) : 'muted';
      openingHtml = '<div class="ledger opening-only">' +
        '<div class="lrow opening"><span class="llabel">Opening Balance</span><span class="lval">' + money(till.opening) + '</span></div>' +
        '</div>';
      closingHtml = '<div class="ledger">' +
        '<div class="lrow subtotal"><span class="llabel">Expected Closing</span><span class="lval">' + money(till.expectedClosing) + '</span></div>' +
        '<div class="lrow"><span class="llabel">Counted</span><span class="lval' + (diffKnown ? '' : ' muted') + '">' + (diffKnown ? money(till.counted) : '—') + '</span></div>' +
        '<div class="lrow grandtotal"><span class="llabel">Difference</span><span class="lval ' + diffClass + '">' + (diffKnown ? fmtSigned(till.difference, currency) : '—') + '</span></div>' +
        '</div>';
    }

    return '<div class="card">' +
      '<div class="cardhead">' +
        '<div class="headrow">' +
          '<span class="kind"><span class="swatch" style="background:var(--ink3)"></span>Cash</span>' +
          '<span class="count">' + inRows.length + ' ' + (inRows.length === 1 ? 'transaction' : 'transactions') + '</span>' +
        '</div>' +
        '<div class="total ' + netClass + '"><span class="cur">' + escapeHtml(currency) + '</span><span>' + netText + '</span></div>' +
      '</div>' +
      openingHtml +
      '<div class="rows">' +
        '<div class="sectionhead"><span>In</span></div>' +
        inBody +
        '<div class="sectiontotal pos"><span class="stitle">Total In</span><span class="stot">' + escapeHtml(currency) + ' ' + fmt(inBucket.total || 0) + '</span></div>' +
        '<div class="sectionhead out"><span>Out</span></div>' +
        outBody +
        '<div class="sectiontotal out"><span class="stitle">Total Out</span><span class="stot">−' + escapeHtml(currency) + ' ' + fmt(outBucket.total || 0) + '</span></div>' +
      '</div>' +
      closingHtml +
      '</div>';
  }

  function renderDay() {
    rowSeq = 0;
    var day = days[state.idx];
    if (!day) return;
    var currency = 'MVR';
    var all = day.transactions || [];
    var byAmount = function (a, b) { return b.amount - a.amount; };
    var transfer = all.filter(function (t) { return t.method === 'transfer'; }).sort(byAmount);
    var cash = all.filter(function (t) { return t.method === 'cash'; }).sort(byAmount);
    var other = all.filter(function (t) { return t.method !== 'transfer' && t.method !== 'cash'; });
    var cashOutTx = (day.cashOutTransactions || []).slice().sort(function (a, b) { return b.amount - a.amount; });

    daynameEl.textContent = day.k === 0 ? 'Today' : day.wd;
    daydateEl.textContent = day.dateFull;
    if (day.k === 0 && day.generatedAt) {
      var g = new Date(day.generatedAt);
      if (!isNaN(g.getTime())) {
        stampEl.innerHTML = '<span class="dot"></span>updated ' +
          g.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Indian/Maldives' });
      }
    } else {
      stampEl.innerHTML = '';
    }

    var html =
      '<div class="cardsrow">' +
        cardHtml('Transfer', 'var(--accent)', day.transfer, transfer, currency, 'transaction') +
        cashCardHtml(day.cash, cash, day.cashOut, cashOutTx, day.till, currency) +
      '</div>';

    if (other.length) {
      var names = {};
      other.forEach(function (t) { names[t.rawMethod || 'unknown'] = true; });
      var nameList = Object.keys(names).map(function (n) { return '"' + escapeHtml(n) + '"'; }).join(', ');
      var otherTotal = other.reduce(function (s, t) { return s + t.amount; }, 0);
      html += '<div class="otherstrip">' +
        '<span><b>' + other.length + (other.length === 1 ? ' payment' : ' payments') + '</b> came in as ' + nameList +
        ' — neither cash nor transfer, so not counted in either total.</span>' +
        '<span class="amt">' + fmt(otherTotal) + '</span>' +
        '</div>';
    }

    var open = openRowKeys();
    contentEl.innerHTML = html;
    restoreOpen(open);
    updatePillStyles();
  }

  // A refresh every 60s must not slam shut a row the user is reading, so
  // remember which rows were open by their reference + amount, not by index.
  function openRowKeys() {
    var keys = {};
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row[aria-expanded="true"]'), function (row) {
      keys[rowKey(row)] = true;
    });
    return keys;
  }
  function rowKey(row) {
    return row.querySelector('.ref').textContent + '|' + row.querySelector('.amt').textContent;
  }
  function restoreOpen(keys) {
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row.has'), function (row) {
      if (keys[rowKey(row)]) setExpanded(row, true, true);
    });
  }
  function setExpanded(row, open, instant) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var wrap = document.getElementById(row.getAttribute('aria-controls'));
    if (!wrap) return;
    if (instant) {
      wrap.classList.add('instant');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { wrap.classList.remove('instant'); });
      });
    }
    wrap.classList.toggle('open', open);
    wrap.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  contentEl.addEventListener('click', function (e) {
    var row = e.target.closest('.row.has');
    if (!row) return;
    setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
  });

  function showMessage(msg) {
    contentEl.innerHTML = '<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  function load(isRefresh) {
    return fetch(DATA_URL, { cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) throw new Error('not-yet');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (payload) {
        var rawDays = payload.days || [];
        if (!rawDays.length) throw new Error('not-yet');
        days = buildViewDays(rawDays);
        if (!state.booted) {
          state.booted = true;
          state.idx = 0;
          buildPills();
        } else {
          // Keep whichever day the person is looking at, and don't yank their
          // pill-strip scroll position back to today on every 60s poll.
          state.idx = Math.min(state.idx, days.length - 1);
          renderPillsHtml();
        }
        renderDay();
      })
      .catch(function (err) {
        if (isRefresh) return;
        if (err.message === 'not-yet') {
          showMessage('No payment data yet — run the “Refresh sales + expenses + today + quotations data” workflow in ike-data once to seed it.');
        } else {
          showMessage('Could not load today’s payments (' + err.message + '). Try refreshing in a minute.');
        }
      });
  }

  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load(true);
  });
})();
</script>
</body>
</html>
